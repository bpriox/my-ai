<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="AI Company Room — چت‌روم چندعاملی هوش مصنوعی"
    />
    <meta name="theme-color" content="#18181b" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d97757' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z'/%3E%3C/svg%3E"
    />
    <title>AI Company Room</title>
    <style>
      :root {
        --bg: #fafafa;
        --fg: #18181b;
        --card: #fff;
        --muted: #f4f4f5;
        --mfg: #71717a;
        --bd: #e4e4e7;
        --pri: #18181b;
        --prf: #fafafa;
        --ring: #3b82f6;
        --err: #dc2626;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b;
          --fg: #fafafa;
          --card: #18181b;
          --muted: #27272a;
          --mfg: #a1a1aa;
          --bd: #27272a;
          --pri: #fafafa;
          --prf: #18181b;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: Vazirmatn, Tahoma, system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        display: flex;
        flex-direction: column;
        max-width: 720px;
        margin: auto;
        padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
        height: 100dvh;
      }
      button,
      select,
      input,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
      svg {
        width: 14px;
        height: 14px;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      header {
        display: flex;
        align-items: center;
        gap: 6px;
        padding-bottom: 10px;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--mfg);
        margin-bottom: 4px;
      }
      header h1 {
        font-size: 22px;
        font-weight: 500;
        margin: 0;
        letter-spacing: -0.01em;
      }
      header .t {
        flex: 1;
      }
      .ghost {
        border: 0;
        background: transparent;
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 13px;
        color: var(--mfg);
      }
      .ghost:hover {
        background: var(--muted);
        color: var(--fg);
      }
      .ghost:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #roster {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 2px 0 10px;
      }
      .chip {
        white-space: nowrap;
        border: 1px solid var(--bd);
        border-radius: 99px;
        padding: 5px 12px;
        font-size: 13px;
        background: var(--card);
        display: flex;
        align-items: center;
        gap: 7px;
        transition: background 0.2s;
      }
      .chip:hover {
        background: var(--muted);
      }
      .chip.add {
        border-style: dashed;
        color: var(--mfg);
        background: transparent;
      }
      .chip.add:hover {
        background: var(--muted);
        color: var(--fg);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
      }
      .bar {
        display: flex;
        gap: 6px;
        align-items: center;
        background: var(--muted);
        border-radius: 12px;
        padding: 4px 4px 4px 12px;
        padding-inline: 12px 4px;
        font-size: 12px;
        color: var(--mfg);
        margin-bottom: 6px;
      }
      .bar .grow {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #log {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 6px 2px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        overflow-anchor: none;
      }
      .in {
        animation: in 0.5s var(--ease) backwards;
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
      }
      .msg.me {
        align-self: flex-start;
        max-width: 90%;
        background: var(--muted);
        border-radius: 18px;
        border-start-start-radius: 4px;
        padding: 10px 14px;
        font-size: 14px;
        line-height: 1.8;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msg.sys {
        align-self: center;
        font-size: 12px;
        color: var(--mfg);
        text-align: center;
        max-width: 90%;
        line-height: 1.7;
      }
      .who {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .who .nm {
        color: var(--mfg);
        font-weight: 400;
      }
      .body {
        font-size: 14px;
        line-height: 1.9;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .err .body {
        color: var(--err);
      }
      .think {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--bd);
        background: color-mix(in srgb, var(--muted) 60%, transparent);
        border-radius: 99px;
        padding: 5px 11px;
        font-size: 12px;
        color: var(--mfg);
        margin-bottom: 10px;
        transition: background 0.2s;
      }
      button.think:hover {
        background: var(--muted);
        color: var(--fg);
      }
      .think.live {
        border: 0;
        background: none;
        padding: 5px 0;
        width: 100%;
      }
      .think .tm {
        margin-inline-start: auto;
        font:
          11px ui-monospace,
          monospace;
        font-variant-numeric: tabular-nums;
      }
      .shim {
        background: linear-gradient(
            90deg,
            var(--mfg) 0,
            var(--mfg) 42%,
            var(--fg) 50%,
            var(--mfg) 58%,
            var(--mfg) 100%
          )
          100% 0/250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: sh 1.8s linear infinite;
      }
      @keyframes sh {
        to {
          background-position: 0 0;
        }
      }
      .chev {
        transition: transform 0.2s;
      }
      .open .chev {
        transform: rotate(90deg);
      }
      html[dir="rtl"] .chev {
        transform: scaleX(-1);
      }
      html[dir="rtl"] .open .chev {
        transform: scaleX(-1) rotate(90deg);
      }
      ol.steps {
        list-style: none;
        margin: 0 7px 14px;
        padding: 0 20px 0 0;
        padding-inline: 20px 0;
        border-inline-start: 1px solid var(--bd);
      }
      ol.steps li {
        position: relative;
        display: flex;
        align-items: center;
        min-height: 30px;
        font-size: 12px;
        color: var(--mfg);
      }
      ol.steps li svg {
        position: absolute;
        inset-inline-start: -27px;
        background: var(--bg);
        box-shadow: 0 0 0 4px var(--bg);
        width: 11px;
        height: 11px;
        stroke: var(--fg);
        border-radius: 50%;
      }
      form {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 24px;
        padding: 14px;
        box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.18);
        margin-top: 10px;
      }
      textarea {
        display: block;
        width: 100%;
        resize: none;
        border: 0;
        background: transparent;
        font-size: 16px;
        line-height: 1.7;
        height: 56px;
        min-height: 56px;
        max-height: 120px;
        padding: 4px;
        border-radius: 8px;
        outline: none;
      }
      textarea::placeholder {
        color: var(--mfg);
      }
      textarea:focus-visible {
        outline: 2px solid var(--ring);
      }
      .row0 {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 10px;
      }
      #tg {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 32px;
        border-radius: 99px;
        border: 1px solid var(--bd);
        background: var(--card);
        color: var(--mfg);
        padding: 0 12px;
        font-size: 12px;
        font-weight: 500;
      }
      #tg[aria-pressed="true"] {
        background: color-mix(in srgb, var(--pri) 6%, transparent);
        color: var(--fg);
        border-color: color-mix(in srgb, var(--pri) 18%, transparent);
      }
      #tg .ck {
        display: none;
        width: 12px;
        height: 12px;
      }
      #tg[aria-pressed="true"] .ck {
        display: block;
      }
      #send {
        position: relative;
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 12px;
        background: var(--pri);
        color: var(--prf);
      }
      #send:disabled {
        opacity: 0.3;
        cursor: default;
      }
      #send span {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          opacity 0.2s,
          scale 0.2s;
      }
      #send .st,
      #send.busy .sd {
        opacity: 0;
        scale: 0.75;
      }
      #send.busy .st {
        opacity: 1;
        scale: 1;
      }
      #send svg {
        width: 16px;
        height: 16px;
      }
      #send .st svg {
        width: 12px;
        height: 12px;
        fill: currentColor;
      }
      dialog {
        border: 1px solid var(--bd);
        border-radius: 20px;
        background: var(--card);
        color: var(--fg);
        width: min(560px, 94vw);
        padding: 20px;
        max-height: 90vh;
        overflow-y: auto;
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.5);
      }
      dialog label {
        display: block;
        font-size: 13px;
        margin: 12px 0 4px;
        color: var(--mfg);
      }
      dialog input {
        width: 100%;
        padding: 9px 10px;
        border: 1px solid var(--bd);
        border-radius: 10px;
        background: var(--bg);
        direction: ltr;
      }
      dialog h3 {
        margin: 0 0 4px;
        font-weight: 600;
      }
      .hint {
        font-size: 12px;
        color: var(--mfg);
        margin-top: 10px;
        line-height: 1.7;
      }
      #dHint.err {
        color: var(--err);
      }
      .btn {
        border: 1px solid var(--bd);
        background: transparent;
        border-radius: 10px;
        padding: 7px 14px;
      }
      .btn.p {
        background: var(--pri);
        color: var(--prf);
        border-color: var(--pri);
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 18px 0 8px;
        font-size: 13px;
        color: var(--mfg);
      }
      .section-head button {
        font-size: 12px;
        padding: 5px 12px;
        border: 1px dashed var(--bd);
        background: transparent;
        border-radius: 8px;
        color: var(--fg);
      }
      .section-head button:hover {
        background: var(--muted);
      }
      #agentList {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .agent-card {
        background: var(--muted);
        border-radius: 12px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .agent-card .row1 {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .agent-card .row1 input {
        flex: 1;
        padding: 7px 9px;
        border: 1px solid var(--bd);
        border-radius: 8px;
        background: var(--bg);
        font-size: 13px;
        min-width: 0;
      }
      .agent-card input.c {
        flex: 0 0 34px !important;
        width: 34px !important;
        height: 34px;
        padding: 2px !important;
        border-radius: 8px !important;
        cursor: pointer;
      }
      .agent-card input.n {
        flex: 1.1 !important;
        direction: auto;
      }
      .agent-card input.i {
        flex: 1 !important;
        direction: auto;
        font-family: ui-monospace, monospace;
        font-size: 12px !important;
      }
      .agent-card .del {
        flex: 0 0 auto;
        border: 0;
        background: transparent;
        color: var(--mfg);
        padding: 6px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .agent-card .del:hover {
        background: color-mix(in srgb, var(--err) 15%, transparent);
        color: var(--err);
      }
      .agent-card .del svg {
        width: 15px;
        height: 15px;
      }
      .agent-card input.m {
        width: 100%;
        padding: 7px 9px;
        border: 1px solid var(--bd);
        border-radius: 8px;
        background: var(--bg);
        font-size: 12px;
        direction: ltr;
        font-family: ui-monospace, monospace;
      }
      .empty-note {
        text-align: center;
        padding: 20px 10px;
        font-size: 13px;
        color: var(--mfg);
        border: 1px dashed var(--bd);
        border-radius: 12px;
      }
      .dialog-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 16px;
      }
      @media (prefers-reduced-motion: reduce) {
        .in,
        .shim {
          animation: none;
        }
        .shim {
          color: var(--mfg);
          background: none;
        }
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="t">
        <div class="eyebrow" id="eye"></div>
        <h1 id="title"></h1>
      </div>
      <button class="ghost" id="lang"></button
      ><button class="ghost" id="setBtn"></button
      ><button class="ghost" id="clr"></button>
    </header>
    <div id="roster"></div>
    <div class="bar" id="bar">
      <span class="grow" id="fInfo"></span
      ><button class="ghost" id="bFolder" type="button"></button
      ><button class="ghost" id="bZip" type="button"></button>
    </div>
    <div id="log" role="log"></div>
    <form id="f">
      <textarea id="t" rows="2"></textarea>
      <div class="row0">
        <button type="button" id="tg" aria-pressed="true">
          <svg viewBox="0 0 24 24">
            <path
              d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"
            /></svg
          ><span id="tgl"></span
          ><svg class="ck" viewBox="0 0 24 24">
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </button>
        <button id="send" type="submit">
          <span class="sd"
            ><svg viewBox="0 0 24 24">
              <path d="m5 12 7-7 7 7M12 19V5" /></svg></span
          ><span class="st"
            ><svg viewBox="0 0 24 24">
              <rect x="5" y="5" width="14" height="14" rx="2" /></svg
          ></span>
        </button>
      </div>
    </form>

    <dialog id="dlg">
      <h3 id="dTitle"></h3>
      <label id="lKey"></label>
      <input
        id="key"
        type="password"
        autocomplete="off"
        placeholder="sk-or-..."
      />
      <label id="lBase"></label>
      <input id="base" placeholder="https://openrouter.ai/api/v1" />

      <div class="section-head">
        <span id="lAgents"></span>
        <button type="button" id="addAgentBtn"></button>
      </div>
      <div id="agentList"></div>

      <p class="hint" id="dHint"></p>
      <div class="dialog-actions">
        <button class="btn" id="cancel" type="button"></button>
        <button class="btn p" id="save" type="button"></button>
      </div>
    </dialog>

    <script>
      /* ---------- translations ---------- */
      const T = {
        fa: {
          eye: "یک تیم کوچک، چند ذهن",
          title: "اتاق شرکت هوش مصنوعی",
          settings: "تنظیمات",
          clear: "پاک کردن",
          ph: "پیام بنویس…",
          welcome:
            "همه پیام‌ها را می‌بینند، اما فقط کسی که منشن شود جواب می‌دهد.",
          welcomeEmpty:
            "هنوز هیچ عاملی نداری. از تنظیمات یکی بساز، بعد با @ایدی منشنش کن.",
          nokey: "اول کلید OpenRouter را در تنظیمات وارد کن.",
          noAgentsWarn: "هیچ عاملی تعریف نشده. اول از تنظیمات یکی اضافه کن.",
          unknownMention: "هیچ عاملی با این ایدی پیدا نشد.",
          dTitle: "تنظیمات",
          lKey: "کلید API (فقط در همین مرورگر می‌ماند)",
          lBase: "آدرس API (سازگار با OpenAI)",
          lAgents: "عوامل هوش مصنوعی",
          addAgent: "افزودن عامل",
          manageAgents: "مدیریت عوامل",
          noAgentsYet: "هنوز عاملی نداری. روی «افزودن عامل» بزن.",
          name: "نام (اختیاری)",
          idLabel: "ایدی (@منشن)",
          modelId: "شناسه مدل (مثلاً meta-llama/llama-3.3-70b-instruct:free)",
          color: "رنگ",
          delete: "حذف",
          save: "ذخیره",
          cancel: "انصراف",
          think: "فکر کردن",
          thinking: "در حال فکر کردن…",
          thought: "{n} ثانیه فکر کرد",
          s1: "خواندن گفتگو ({n} پیام)",
          s2: "پرسیدن از {m}",
          s3: "{n} فایل ذخیره شد",
          stopped: "متوقف شد",
          hint: "مدل‌های رایگان OpenRouter با «:free» تمام می‌شوند. اگر خطای 404 یا 429 دیدی، شناسه مدل را از openrouter.ai/models عوض کن.",
          err: "خطا",
          errIdEmpty: "عامل {n}: ایدی خالی است",
          errModelEmpty: "عامل {n}: شناسه مدل خالی است",
          errIdDup: "ایدی «{id}» تکراری است",
          files: "فایل‌ها",
          zip: "دانلود ZIP",
          folder: "انتخاب پوشه",
          folderOn: "پوشه فعال:",
          noFiles: "هنوز فایلی ساخته نشده",
        },
        en: {
          eye: "A small team, several minds",
          title: "AI Company Room",
          settings: "Settings",
          clear: "Clear",
          ph: "Type a message…",
          welcome:
            "Everyone sees every message, but only the mentioned agent replies.",
          welcomeEmpty:
            "No agents yet. Create one in Settings, then @mention it.",
          nokey: "Enter your OpenRouter key in Settings first.",
          noAgentsWarn: "No agents defined. Add one in Settings first.",
          unknownMention: "No agent found with that ID.",
          dTitle: "Settings",
          lKey: "API key (stays in this browser only)",
          lBase: "API base URL (OpenAI-compatible)",
          lAgents: "AI Agents",
          addAgent: "Add agent",
          manageAgents: "Manage agents",
          noAgentsYet: "No agents yet. Click “Add agent” to create one.",
          name: "Name (optional)",
          idLabel: "ID (@mention)",
          modelId: "Model ID (e.g. meta-llama/llama-3.3-70b-instruct:free)",
          color: "Color",
          delete: "Delete",
          save: "Save",
          cancel: "Cancel",
          think: "Think",
          thinking: "Thinking it through",
          thought: "Thought for {n}s",
          s1: "Reading the conversation ({n} messages)",
          s2: "Asking {m}",
          s3: "Saved {n} file(s)",
          stopped: "Stopped",
          hint: "Free OpenRouter models end in “:free” and change over time. If you get a 404 or 429, pick a new model ID from openrouter.ai/models.",
          err: "Error",
          errIdEmpty: "Agent {n}: ID is empty",
          errModelEmpty: "Agent {n}: model ID is empty",
          errIdDup: "Duplicate ID: {id}",
          files: "Files",
          zip: "Download ZIP",
          folder: "Choose folder",
          folderOn: "Folder:",
          noFiles: "No files yet",
        },
      };

      /* ---------- helpers ---------- */
      const $ = (s) => document.querySelector(s);
      const store = {
        get(k, d) {
          try {
            const v = localStorage.getItem(k);
            return v == null ? d : v;
          } catch (e) {
            return d;
          }
        },
        set(k, v) {
          try {
            localStorage.setItem(k, v);
          } catch (e) {}
        },
      };
      const escapeHtml = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const sanitizeId = (s) =>
        (s || "").replace(/[^\p{L}\p{N}_]/gu, "").slice(0, 32);
      const tr = (k, v = {}) =>
        (T[lang][k] || k).replace(/\{(\w+)\}/g, (_, x) => v[x]);

      /* ---------- state ---------- */
      let lang = store.get("lang", "fa");
      let agents = [];
      try {
        agents = JSON.parse(store.get("agents", "[]")) || [];
      } catch (e) {
        agents = [];
      }
      let draftAgents = [];
      let history = [],
        busy = false,
        ctrl = null,
        stopped = false,
        tick = 0;
      let think = store.get("think", "1") === "1";
      const files = new Map();
      let dir = null;

      const I = {
        spark:
          '<svg viewBox="0 0 24 24"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>',
        chev: '<svg class="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>',
        check: '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
        trash:
          '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14"/></svg>',
        plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
      };

      /* ---------- render ---------- */
      function applyLang() {
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";
        $("#lang").textContent = lang === "fa" ? "EN" : "فا";
        $("#eye").innerHTML = I.spark + tr("eye");
        $("#title").textContent = tr("title");
        $("#setBtn").textContent = tr("settings");
        $("#clr").textContent = tr("clear");
        $("#t").placeholder = tr("ph");
        $("#t").setAttribute("aria-label", tr("ph"));
        $("#tgl").textContent = tr("think");
        $("#bZip").textContent = tr("zip");
        $("#bFolder").textContent = tr("folder");
        updateBar();
        $("#dTitle").textContent = tr("dTitle");
        $("#lKey").textContent = tr("lKey");
        $("#lBase").textContent = tr("lBase");
        $("#lAgents").textContent = tr("lAgents");
        $("#addAgentBtn").innerHTML = I.plus + " " + tr("addAgent");
        $("#save").textContent = tr("save");
        $("#cancel").textContent = tr("cancel");
        if (!$("#dHint").classList.contains("err"))
          $("#dHint").textContent = tr("hint");
        $("#send").setAttribute("aria-label", busy ? "Stop" : "Send");
        renderRoster();
        renderLog();
      }

      function renderRoster() {
        const r = $("#roster");
        r.innerHTML = "";
        if (!agents.length) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "chip add";
          b.innerHTML = I.plus + " " + tr("addAgent");
          b.onclick = openSettings;
          r.appendChild(b);
          return;
        }
        agents.forEach((a) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "chip";
          b.title = a.name && a.name !== a.id ? a.name : "";
          b.innerHTML = `<span class="dot" style="background:${escapeHtml(a.color)}"></span>@${escapeHtml(a.id)}`;
          b.onclick = () => {
            const t = $("#t");
            t.value +=
              (t.value && !t.value.endsWith(" ") ? " " : "") + "@" + a.id + " ";
            t.focus();
            grow();
          };
          r.appendChild(b);
        });
        const add = document.createElement("button");
        add.type = "button";
        add.className = "chip add";
        add.innerHTML = I.plus;
        add.title = tr("manageAgents");
        add.setAttribute("aria-label", tr("manageAgents"));
        add.onclick = openSettings;
        r.appendChild(add);
      }

      function renderLog() {
        const log = $("#log");
        log.innerHTML = "";
        const w = document.createElement("div");
        w.className = "msg sys";
        w.textContent = agents.length ? tr("welcome") : tr("welcomeEmpty");
        log.appendChild(w);
        history.forEach((m) => log.appendChild(bubble(m)));
        log.scrollTop = log.scrollHeight;
      }

      function bubble(m) {
        const d = document.createElement("div");
        const anim = !m.seen;
        if (anim) m.seen = true;

        if (m.role === "user") {
          d.className = "msg me" + (anim ? " in" : "");
          d.textContent = m.text;
          return d;
        }

        if (m.sys) {
          d.className = "msg sys" + (anim ? " in" : "");
          d.textContent = m.text;
          return d;
        }

        const a = agents.find((x) => x.id === m.agent);
        if (!a) {
          d.className = "msg sys" + (anim ? " in" : "");
          d.textContent = (m.agent ? `[${m.agent}] ` : "") + m.text;
          return d;
        }

        d.className = "msg" + (m.err ? " err" : "") + (anim ? " in" : "");
        const w = document.createElement("div");
        w.className = "who";
        w.style.color = a.color;
        w.innerHTML =
          `<span class="dot" style="background:${escapeHtml(a.color)}"></span>` +
          `<span>@${escapeHtml(a.id)}</span>` +
          (a.name && a.name !== a.id
            ? `<span class="nm">— ${escapeHtml(a.name)}</span>`
            : "");
        d.appendChild(w);

        if (m.wait) {
          if (think) {
            const p = document.createElement("div");
            p.className = "think live";
            p.innerHTML = `${I.spark}<span class="shim">${tr("thinking")}</span><span class="tm">${Math.round((Date.now() - m.t0) / 1000)}s</span>`;
            p.querySelector(".tm").dataset.t0 = m.t0;
            d.appendChild(p);
          } else {
            const s = document.createElement("div");
            s.className = "body";
            s.style.color = "var(--mfg)";
            s.textContent = "…";
            d.appendChild(s);
          }
          return d;
        }

        if (think && m.steps) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "think" + (m.open ? " open" : "");
          b.setAttribute("aria-expanded", !!m.open);
          b.innerHTML = `${I.spark}<span>${tr("thought", { n: m.secs })}</span>${I.chev}`;
          b.onclick = () => {
            m.open = !m.open;
            const y = $("#log").scrollTop;
            renderLog();
            $("#log").scrollTop = y;
          };
          d.appendChild(b);
          if (m.open) {
            const o = document.createElement("ol");
            o.className = "steps";
            o.innerHTML = m.steps
              .map((s) => `<li>${I.check}${escapeHtml(s)}</li>`)
              .join("");
            d.appendChild(o);
          }
        }

        const s = document.createElement("div");
        s.className = "body";
        s.textContent = m.text;
        d.appendChild(s);
        return d;
      }

      /* ---------- mentions & messages ---------- */
      function mentions(text, exclude) {
        const found = [];
        for (const m of text.matchAll(/@([\p{L}\p{N}_]+)/gu)) {
          const n = m[1].toLowerCase();
          const a = agents.find((x) => x.id.toLowerCase() === n);
          if (a && a.id !== exclude && !found.includes(a.id)) found.push(a.id);
        }
        return found;
      }

      function buildMessages(a) {
        const roster = agents
          .map(
            (x) =>
              "@" + x.id + (x.name && x.name !== x.id ? ` (${x.name})` : ""),
          )
          .join(", ");
        const sys = `You are @${a.id}${a.name && a.name !== a.id ? ` (${a.name})` : ""}, a member of a small AI company chat room with a human founder and these colleagues: ${roster}. You see the whole conversation, but you only speak when someone @mentions you. Reply in the language the founder is writing in. Be concise and practical. If you need a colleague to do something, mention them with @name at the end of your reply; otherwise do not mention anyone. When you create code or project files, put each file in its own fenced code block whose first line is a comment with the path, like \`// file: src/app.js\`, \`# file: main.py\` or \`<!-- file: index.html -->\`. Always write the complete file content, never partial snippets.`;
        const out = [{ role: "system", content: sys }];
        history
          .filter((m) => !m.wait && !m.err && !m.sys)
          .forEach((m) => {
            const role = m.agent === a.id ? "assistant" : "user";
            const content =
              m.role === "user"
                ? m.text
                : m.agent === a.id
                  ? m.text
                  : `[@${m.agent}]: ${m.text}`;
            const last = out[out.length - 1];
            if (last.role === role && role !== "system")
              last.content += "\n\n" + content;
            else out.push({ role, content });
          });
        return out;
      }

      async function ask(a) {
        const key = store.get("key", "");
        const base = (
          store.get("base", "") || "https://openrouter.ai/api/v1"
        ).replace(/\/+$/, "");
        const r = await fetch(base + "/chat/completions", {
          method: "POST",
          signal: ctrl.signal,
          headers: Object.assign(
            { "Content-Type": "application/json" },
            key ? { Authorization: "Bearer " + key } : {},
            base.includes("openrouter.ai")
              ? { "X-Title": "AI Company Room" }
              : {},
          ),
          body: JSON.stringify({
            model: a.model,
            messages: buildMessages(a),
          }),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok)
          throw new Error((j.error && j.error.message) || "HTTP " + r.status);
        const c =
          j.choices &&
          j.choices[0] &&
          j.choices[0].message &&
          j.choices[0].message.content;
        if (!c) throw new Error("Empty response");
        return c.trim();
      }

      /* ---------- run loop ---------- */
      function setBusy(v) {
        busy = v;
        $("#send").classList.toggle("busy", v);
        $("#send").setAttribute("aria-label", v ? "Stop" : "Send");
        clearInterval(tick);
        if (v)
          tick = setInterval(
            () =>
              document
                .querySelectorAll(".tm")
                .forEach(
                  (e) =>
                    (e.textContent =
                      Math.round((Date.now() - e.dataset.t0) / 1000) + "s"),
                ),
            1000,
          );
      }

      async function run(queue) {
        let steps = 0;
        ctrl = new AbortController();
        stopped = false;
        while (queue.length && steps < 6 && !stopped) {
          const id = queue.shift();
          const a = agents.find((x) => x.id === id);
          if (!a) continue;
          steps++;
          const t0 = Date.now(),
            ph = { role: "assistant", agent: a.id, wait: true, t0, seen: true };
          const nMsgs = history.length;
          history.push(ph);
          renderLog();
          try {
            const text = await ask(a);
            const before = files.size;
            await extractFiles(text);
            const st = [tr("s1", { n: nMsgs }), tr("s2", { m: a.model })];
            if (files.size > before || /file:/i.test(text))
              st.push(
                tr("s3", {
                  n: [...text.matchAll(/file:\s*[^\s>*]+/gi)].length,
                }),
              );
            history.splice(history.indexOf(ph), 1, {
              role: "assistant",
              agent: a.id,
              text,
              steps: st,
              secs: Math.round((Date.now() - t0) / 1000),
            });
            mentions(text, a.id).forEach((mid) => {
              if (!queue.includes(mid)) queue.push(mid);
            });
          } catch (e) {
            if (e.name === "AbortError") history.splice(history.indexOf(ph), 1);
            else
              history.splice(history.indexOf(ph), 1, {
                role: "assistant",
                agent: a.id,
                text: tr("err") + ": " + e.message,
                err: true,
              });
          }
          renderLog();
        }
      }

      /* ---------- files ---------- */
      function updateBar() {
        const n = files.size;
        $("#fInfo").textContent =
          (n
            ? tr("files") + ": " + [...files.keys()].join(", ")
            : tr("noFiles")) +
          (dir ? "  |  " + tr("folderOn") + " " + dir.name : "");
        $("#bZip").disabled = !n;
        $("#bFolder").style.display = window.showDirectoryPicker ? "" : "none";
      }

      const cleanPath = (p) =>
        p
          .replace(/\\/g, "/")
          .split("/")
          .filter((x) => x && x !== "." && x !== "..")
          .join("/");

      async function extractFiles(text) {
        for (const m of text.matchAll(/```[^\n]*\n([\s\S]*?)```/g)) {
          const lines = m[1].split("\n");
          const h = lines[0].match(/file:\s*([^\s>*]+)/i);
          if (!h) continue;
          const path = cleanPath(h[1]);
          if (!path) continue;
          files.set(path, lines.slice(1).join("\n"));
          if (dir)
            try {
              await writeToDir(path, files.get(path));
            } catch (e) {}
        }
        updateBar();
      }

      async function writeToDir(path, content) {
        const parts = path.split("/");
        let d = dir;
        for (const x of parts.slice(0, -1))
          d = await d.getDirectoryHandle(x, { create: true });
        const fh = await d.getFileHandle(parts[parts.length - 1], {
          create: true,
        });
        const w = await fh.createWritable();
        await w.write(content);
        await w.close();
      }

      const CRC = (() => {
        const t = [];
        for (let n = 0; n < 256; n++) {
          let c = n;
          for (let k = 0; k < 8; k++)
            c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
          t[n] = c >>> 0;
        }
        return t;
      })();
      const crc32 = (b) => {
        let c = 0xffffffff;
        for (const x of b) c = CRC[(c ^ x) & 255] ^ (c >>> 8);
        return (c ^ 0xffffffff) >>> 0;
      };

      function makeZip(map) {
        const enc = new TextEncoder(),
          parts = [],
          central = [];
        let off = 0;
        for (const [name, txt] of map) {
          const nb = enc.encode(name),
            db = enc.encode(txt),
            crc = crc32(db);
          const lh = new DataView(new ArrayBuffer(30));
          lh.setUint32(0, 0x04034b50, true);
          lh.setUint16(4, 20, true);
          lh.setUint16(6, 0x0800, true);
          lh.setUint32(14, crc, true);
          lh.setUint32(18, db.length, true);
          lh.setUint32(22, db.length, true);
          lh.setUint16(26, nb.length, true);
          parts.push(lh.buffer, nb, db);
          const ch = new DataView(new ArrayBuffer(46));
          ch.setUint32(0, 0x02014b50, true);
          ch.setUint16(4, 20, true);
          ch.setUint16(6, 20, true);
          ch.setUint16(8, 0x0800, true);
          ch.setUint32(16, crc, true);
          ch.setUint32(20, db.length, true);
          ch.setUint32(24, db.length, true);
          ch.setUint16(28, nb.length, true);
          ch.setUint32(42, off, true);
          central.push(ch.buffer, nb);
          off += 30 + nb.length + db.length;
        }
        const csize = central.reduce((a, b) => a + b.byteLength, 0);
        const end = new DataView(new ArrayBuffer(22));
        end.setUint32(0, 0x06054b50, true);
        end.setUint16(8, map.size, true);
        end.setUint16(10, map.size, true);
        end.setUint32(12, csize, true);
        end.setUint32(16, off, true);
        return new Blob([...parts, ...central, end.buffer], {
          type: "application/zip",
        });
      }

      $("#bZip").onclick = () => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(makeZip(files));
        a.download = "project.zip";
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      };
      $("#bFolder").onclick = async () => {
        try {
          dir = await window.showDirectoryPicker({ mode: "readwrite" });
          for (const [p, c] of files) await writeToDir(p, c);
          updateBar();
        } catch (e) {}
      };

      /* ---------- settings dialog ---------- */
      function renderAgentEditor() {
        const list = $("#agentList");
        list.innerHTML = "";
        if (!draftAgents.length) {
          const p = document.createElement("div");
          p.className = "empty-note";
          p.textContent = tr("noAgentsYet");
          list.appendChild(p);
          return;
        }
        draftAgents.forEach((a, i) => {
          const card = document.createElement("div");
          card.className = "agent-card";
          card.innerHTML = `
            <div class="row1">
              <input type="color" class="c" value="${escapeHtml(a.color || "#3b82f6")}" title="${tr("color")}" aria-label="${tr("color")}">
              <input class="n" placeholder="${tr("name")}" value="${escapeHtml(a.name || "")}" aria-label="${tr("name")}">
              <input class="i" placeholder="@${tr("idLabel")}" value="${escapeHtml(a.id || "")}" aria-label="${tr("idLabel")}">
              <button type="button" class="del" title="${tr("delete")}" aria-label="${tr("delete")}">${I.trash}</button>
            </div>
            <input class="m" placeholder="${tr("modelId")}" value="${escapeHtml(a.model || "")}" aria-label="${tr("modelId")}">
          `;
          card.querySelector(".c").oninput = (e) => (a.color = e.target.value);
          card.querySelector(".n").oninput = (e) => (a.name = e.target.value);
          card.querySelector(".i").oninput = (e) => (a.id = e.target.value);
          card.querySelector(".m").oninput = (e) => (a.model = e.target.value);
          card.querySelector(".del").onclick = () => {
            draftAgents.splice(i, 1);
            renderAgentEditor();
          };
          list.appendChild(card);
        });
      }

      function openSettings() {
        $("#key").value = store.get("key", "");
        $("#base").value = store.get("base", "");
        draftAgents = agents.map((a) => ({ ...a }));
        $("#dHint").textContent = tr("hint");
        $("#dHint").classList.remove("err");
        renderAgentEditor();
        $("#dlg").showModal();
      }

      function commitAgents() {
        const cards = [...document.querySelectorAll("#agentList .agent-card")];
        const cleaned = [];
        const seen = new Set();
        const errors = [];
        cards.forEach((card, i) => {
          const color = card.querySelector(".c").value;
          const name = card.querySelector(".n").value.trim();
          const id = sanitizeId(card.querySelector(".i").value);
          const model = card.querySelector(".m").value.trim();
          if (!id) {
            errors.push(tr("errIdEmpty", { n: i + 1 }));
            return;
          }
          if (!model) {
            errors.push(tr("errModelEmpty", { n: i + 1 }));
            return;
          }
          if (seen.has(id)) {
            errors.push(tr("errIdDup", { id }));
            return;
          }
          seen.add(id);
          cleaned.push({ id, name: name || id, color, model });
        });
        if (errors.length) {
          $("#dHint").textContent = errors.join(" • ");
          $("#dHint").classList.add("err");
          return false;
        }
        agents = cleaned;
        store.set("agents", JSON.stringify(agents));
        return true;
      }

      $("#addAgentBtn").onclick = () => {
        draftAgents.push({
          id: "",
          name: "",
          color: "#3b82f6",
          model: "meta-llama/llama-3.3-70b-instruct:free",
        });
        renderAgentEditor();
        const cards = document.querySelectorAll("#agentList .agent-card");
        const last = cards[cards.length - 1];
        if (last) last.querySelector(".n").focus();
      };

      $("#save").onclick = () => {
        if (!commitAgents()) return;
        store.set("key", $("#key").value.trim());
        store.set("base", $("#base").value.trim());
        $("#dlg").close();
        renderRoster();
        renderLog();
      };

      $("#cancel").onclick = () => $("#dlg").close();

      $("#setBtn").onclick = openSettings;

      /* ---------- composer ---------- */
      const ta = $("#t");
      function grow() {
        ta.style.height = "auto";
        ta.style.height = Math.max(56, Math.min(ta.scrollHeight, 120)) + "px";
      }
      ta.addEventListener("input", grow);

      $("#tg").onclick = () => {
        think = !think;
        store.set("think", think ? "1" : "0");
        $("#tg").setAttribute("aria-pressed", think);
        renderLog();
      };

      $("#send").addEventListener("click", (e) => {
        if (busy) {
          e.preventDefault();
          stopped = true;
          ctrl && ctrl.abort();
        }
      });

      $("#f").addEventListener("submit", async (e) => {
        e.preventDefault();
        const v = ta.value.trim();
        if (!v || busy) return;

        if (!agents.length) {
          history.push({ sys: true, text: tr("noAgentsWarn") });
          renderLog();
          openSettings();
          return;
        }

        if (!store.get("key", "") && !store.get("base", "")) {
          history.push({ sys: true, text: tr("nokey") });
          renderLog();
          openSettings();
          return;
        }

        ta.value = "";
        grow();
        history.push({ role: "user", text: v });

        const q = mentions(v);
        if (!q.length) {
          if (/@[\p{L}\p{N}_]+/u.test(v)) {
            history.push({ sys: true, text: tr("unknownMention") });
          }
          renderLog();
          return;
        }

        renderLog();
        setBusy(true);
        await run(q);
        setBusy(false);
        ta.focus();
      });

      ta.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          $("#f").requestSubmit();
        }
      });

      $("#lang").onclick = () => {
        lang = lang === "fa" ? "en" : "fa";
        store.set("lang", lang);
        applyLang();
      };

      $("#clr").onclick = () => {
        history = [];
        files.clear();
        updateBar();
        renderLog();
      };

      $("#tg").setAttribute("aria-pressed", think);

      /* ---------- boot ---------- */
      applyLang();
    </script>
  </body>
</html>
